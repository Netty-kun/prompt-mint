[package]
name = "prompt-hash"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
version.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
stellar-tokens = { workspace = true }
stellar-macros = { workspace = true }
stellar-access = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1"

[features]
# Compile gas_bench.rs without the (large) unit/fuzz suites. Used by
# `yarn test:gas` and .github/workflows/contract-gas-benchmarks.yml.
isolate-gas-bench = []
